# Docker Compose configuration for NS3-Gazebo development environment

version: '3.8'

services:
  # Main development environment
  ns3-gazebo-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: ns3-gazebo:latest
    container_name: ns3-gazebo-dev
    hostname: ns3-gazebo-dev
    volumes:
      # Mount source code for development
      - .:/workspace/ns3_gazebo
      # Persist user data
      - ns3_gazebo_home:/home/developer
      # X11 forwarding for GUI applications
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
    networks:
      - ns3_network
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun
    stdin_open: true
    tty: true
    working_dir: /workspace/ns3_gazebo
    command: /bin/bash

  # Lightweight test runner
  ns3-gazebo-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: ns3-gazebo:latest
    container_name: ns3-gazebo-test
    volumes:
      - .:/workspace/ns3_gazebo
    networks:
      - ns3_network
    working_dir: /workspace/ns3_gazebo
    command: bash -c "cd /workspace/ns3_gazebo && ./scripts/verify_installation.sh"
    depends_on:
      - ns3-gazebo-dev

  # Gazebo simulation server (headless)
  gazebo-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ns3-gazebo:latest
    container_name: gazebo-server
    volumes:
      - .:/workspace/ns3_gazebo
    environment:
      - GZ_SIM_SYSTEM_PLUGIN_PATH=/workspace/ns3_gazebo/ns3_gazebo_plugin/build
    networks:
      - ns3_network
    ports:
      - "11345:11345"  # Gazebo default port
    working_dir: /workspace/ns3_gazebo
    command: bash -c "source /opt/ros/jazzy/setup.bash && gz sim ns3_gazebo_plugin/gazebo_ros_diff_drive_ns3_gazebo.world --headless"

  # ROS2 node runner
  ros2-nodes:
    build:
      context: .
      dockerfile: Dockerfile
    image: ns3-gazebo:latest
    container_name: ros2-nodes
    volumes:
      - .:/workspace/ns3_gazebo
    networks:
      - ns3_network
    depends_on:
      - gazebo-server
    working_dir: /workspace/ns3_gazebo
    command: bash -c "source /opt/ros/jazzy/setup.bash && source ns3_gazebo_ws/install/setup.bash && sleep 5 && ros2 run diff_drive_ns3 diff_drive_ns3_node"

networks:
  ns3_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  ns3_gazebo_home:
    driver: local